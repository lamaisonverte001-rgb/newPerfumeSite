services:
  db:
    image: postgres:16-alpine
    container_name: carbon_perfume_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-carbon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carbon_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-carbon_perfume}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-carbon} -d $${POSTGRES_DB:-carbon_perfume}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: carbon_perfume_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-carbon}:${POSTGRES_PASSWORD:-carbon_secret_2026}@db:5432/${POSTGRES_DB:-carbon_perfume}?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-carbon-atelier-2026}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-carbon-perfume-hmac-secret-docker-2026}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"

  adminer:
    image: adminer:latest
    container_name: carbon_perfume_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"

volumes:
  postgres_data:
